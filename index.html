<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
</head>
<body>
    <div class="Heading">
    <h1>Type it</h1>
    <h3> We'll find it</h3>
    </div>
    <form id="dictionary" method="get">
<label id="word" for="word" aria-placeholder="Please enter your word" >Enter Word</label>
<div id="audioWrapper">
    <label id="audioLabel" for="audioPlayer">Pronunciation:</label>
    <audio id="audioPlayer" controls></audio>
  </div>
<button id="submit">Submit</button>
    </form>
</body>
</html>
